name: Test SSM Compression

on:
  push:
    paths:
      - 'benchmark/fm/mamba/**.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run compression tests
        run: |
          cd benchmark
          python -m fm.mamba.test_mamba_gramians
          python -m fm.mamba.test_s4_gramians
