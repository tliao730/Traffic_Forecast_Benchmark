[project]
name = "kairos-env"
version = "0.1.0"
description = "Environment for Kairos model benchmark (Kairos repo + GiftEval)"
requires-python = ">=3.10,<3.11"
dependencies = [
    # === 1. Kairos repo: pip install -r requirements.txt ===
    "matplotlib==3.10.1",
    # numpy: Kairos asks 2.2.5 but scipy/sklearn in stack require numpy<2; use 1.26.x for runtime
    "numpy>=1.26.0,<1.27",
    "pandas==2.2.3",
    "torch==2.6.0",
    "transformers==4.56.1",
    "einops==0.8.1",
    "jaxtyping==0.3.1",
    # === 2. GiftEval benchmark: need gluonts>=0.15 for evaluate_model(batch_size=...) ===
    "gluonts~=0.15.1",
    "python-dotenv>=1.0.0",
    "datasets==3.5.1",
    # === 3. GiftEval package + benchmark script ===
    "salesforce-gift-eval @ git+https://github.com/DensoSVIC/gift-eval.git@traffic",
    "tqdm",
]

# When salesforce-gift-eval (or other deps) declare conflicting versions,
# force the versions from Kairos + GiftEval Setup Instructions above.
[tool.uv]
override-dependencies = [
    "numpy>=1.26.0,<1.27",
    "matplotlib==3.10.1",
    "pandas==2.2.3",
    "gluonts~=0.15.1",
    "einops==0.8.1",
    "datasets==3.5.1",
]
