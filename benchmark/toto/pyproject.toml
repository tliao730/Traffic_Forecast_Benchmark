[project]
name = "toto-env"
version = "0.1.0"
description = "Environment for Toto model benchmark (DataDog/toto)"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Toto official requirements (from DataDog/toto requirements.txt)
    "torch==2.7.0",
    "aioboto3==12.4.0",
    "beartype==0.18.5",
    "boto3==1.34.69",
    "datasets==2.17.1",
    "dill==0.3.8",
    "einops==0.7.0",
    "gluonts[torch]==0.15.1",
    "jaxtyping==0.2.29",
    "mypy==1.11.1",
    "pandas==2.2.3",
    "pytest==8.3.5",
    "pytest-env==1.1.5",
    "rotary-embedding-torch==0.8.6",
    "scikit-learn==1.5.0",
    "types-tabulate==0.9.0.20241207",
    "transformers==4.52.1",
    "tqdm==4.66.3",
    "pyyaml==6.0.2",
    "types-PyYAML==6.0.12.20240917",
    "black==24.10.0",
    "isort==5.13.2",
    "jupyter==1.1.1",
    "matplotlib==3.9.2",
    "tabulate==0.9.0",
    # Benchmark harness (numpy used by benchmark/toto.py and gluonts)
    "numpy>=1.26.0,<3",
]

[tool.uv]
# Prefer toto requirements.txt versions; override any transitive conflicts
override-dependencies = [
    "torch==2.7.0",
    "datasets==2.17.1",
    "pandas==2.2.3",
    "matplotlib==3.9.2",
    "einops==0.7.0",
    "gluonts[torch]==0.15.1",
]
